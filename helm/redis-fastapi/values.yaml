fastapi:

  replicaCount: 1

  image:
    repository: redis-fastapi
    tag: v1

  service:
    type: NodePort
    port: 8000
    nodePort: 30080


redis:

  image:
    repository: redis
    tag: "7"

  persistence:
    enabled: true
    size: 1Gi


resources:

  requests:
    cpu: "100m"
    memory: "128Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"
