apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:

      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"

        ports:
        - containerPort: 6379

        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping

          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping

          initialDelaySeconds: 5
          periodSeconds: 5

        volumeMounts:
        - name: redis-storage
          mountPath: /data


      volumes:
      - name: redis-storage

        persistentVolumeClaim:
          claimName: redis-pvc
