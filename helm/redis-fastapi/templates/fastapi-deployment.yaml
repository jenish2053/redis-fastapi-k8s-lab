apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "redis-fastapi.fullname" . }}-fastapi
  labels:
    {{- include "redis-fastapi.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.fastapi.replicaCount }}

  selector:
    matchLabels:
      app: fastapi

  template:

    metadata:
      labels:
        app: fastapi
        {{- include "redis-fastapi.labels" . | nindent 8 }}

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:

      - name: fastapi

        image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"

        imagePullPolicy: Always

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        ports:

        - containerPort: 8000


        env:

        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "redis-fastapi.fullname" . }}-secret
              key: REDIS_PASSWORD


        - name: REDIS_HOST
          value: {{ include "redis-fastapi.fullname" . }}-redis-service


        livenessProbe:

          httpGet:

            path: /health

            port: 8000

          initialDelaySeconds: 10

          periodSeconds: 10


        readinessProbe:

          httpGet:

            path: /health

            port: 8000

          initialDelaySeconds: 5

          periodSeconds: 5


        resources:

          requests:

            cpu: {{ .Values.resources.requests.cpu }}

            memory: {{ .Values.resources.requests.memory }}


          limits:

            cpu: {{ .Values.resources.limits.cpu }}

            memory: {{ .Values.resources.limits.memory }}
