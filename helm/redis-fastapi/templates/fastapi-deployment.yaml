apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "redis-fastapi.fullname" . }}-fastapi
  labels:
    {{- include "redis-fastapi.labels" . | nindent 4 }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi
        {{- include "redis-fastapi.labels" . | nindent 8 }}

    spec:
      containers:
        - name: fastapi

          image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: REDIS_HOST
              value: "redis-fastapi-redis-fastapi-redis-service"

            - name: REDIS_PORT
              value: "6379"

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-fastapi-redis-fastapi-secret
                  key: REDIS_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
