apiVersion: v1
kind: Service

metadata:

  name: {{ include "redis-fastapi.fullname" . }}-redis-service

  labels:

    {{- include "redis-fastapi.labels" . | nindent 4 }}


spec:

  type: {{ .Values.redis.service.type }}


  selector:

    app: redis


  ports:

  - port: {{ .Values.redis.service.port }}

    targetPort: 6379
